<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72" role="img" aria-labelledby="title desc">
  <title id="title">知弦</title>
  <desc id="desc">浅鸢尾紫底上一条紫墨色的弦：两端落在同一水平线上，中间随振动起伏。</desc>
  <defs>
    <clipPath id="mask"><rect x="18" y="18" width="72" height="72" rx="22"/></clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFE8FF"/>
      <stop offset="1" stop-color="#DCCFF3"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#mask)">
    <g id="background"><path fill="url(#field)" d="M0 0H108V108H0Z"/></g>
    <g id="foreground">
      <path fill="none" stroke="#342B48" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" d="M28 56Q41 28 54 56Q67 84 80 56"/>
    </g>
  </g>
</svg>
